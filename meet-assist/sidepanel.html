<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Meet Assist</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header>
      <strong>Meet Assist</strong>
      <a id="settings" href="options.html" target="_blank">Settings</a>
    </header>
    <p class="hint">Meet Chrome mein khula ho. Client ki baat upar aayegi. Jo bolna hai woh neeche hai.</p>
    <div class="row">
      <button id="start" type="button">Start</button>
      <button id="stop" type="button" disabled>Stop</button>
      <label class="hear"><input id="hear" type="checkbox" checked /> Hear call</label>
    </div>
    <p id="status">Add keys in Settings, then open Google Meet.</p>
    <section>
      <h2>Live</h2>
      <p id="live" class="live">…</p>
    </section>
    <section>
      <h2>Urdu</h2>
      <p id="urdu">…</p>
    </section>
    <section class="say">
      <h2>Say this</h2>
      <p id="suggestion">…</p>
    </section>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
